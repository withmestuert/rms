spring.application.name=rms-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/rms_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Baseline_As_Is_Schema

# Razorpay Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_rms_mock_key}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_rms_mock_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_default}
razorpay.currency=INR
razorpay.company.name=RMS Living
# Auto Monthly Rent Invoice Scheduler Configuration
rms.billing.auto-invoice.enabled=true
rms.billing.auto-invoice.cron=0 5 0 1 * ?
rms.billing.auto-invoice.due-day=5
