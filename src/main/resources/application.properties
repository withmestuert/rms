spring.application.name=rms-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}
spring.jpa.open-in-view=false
rms.security.enabled=${RMS_SECURITY_ENABLED:true}
rms.security.test-owner-id=${RMS_SECURITY_TEST_OWNER_ID:}
rms.security.self-registration-enabled=${RMS_SELF_REGISTRATION_ENABLED:false}
rms.security.bootstrap-key=${RMS_BOOTSTRAP_KEY:}
rms.security.token-ttl=${RMS_TOKEN_TTL:8h}
rms.security.allowed-origins=${RMS_ALLOWED_ORIGINS:http://localhost:3000,https://rms-frontend-xumo.onrender.com}
